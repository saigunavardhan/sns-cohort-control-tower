<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNS Cohort Control Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  :root, [data-theme="light"] {
    --paper: #F3F5F7; --surface: #FFFFFF; --raised: #FFFFFF; --ink: #1B2430; --slate: #5B6878; --faint: #8A95A3;
    --rule: #D8DEE5; --rule-soft: #E8ECF0; --track: #D9DFE6;
    --hema: #3F3A8C; --hema-hover: #332E78; --hema-soft: #ECEBF7; --on-hema: #FFFFFF;
    --ready: #2F7D5B; --conditional: #B7791F; --blocked: #B42318; --insufficient: #3F5E8C;
    --dot: #8C97A6; --mean: #1B2430; --err-bg: #FDF3F2; --err-line: #F1C4C0; --ok-bg: #F1F8F4; --ok-line: #C7E3D4;
  }
  [data-theme="dark"] {
    --paper: #2B2C2F; --surface: #333539; --raised: #3A3C41; --ink: #ECEDEE; --slate: #B0B5BC; --faint: #8C9198;
    --rule: #4A4D53; --rule-soft: #42454A; --track: #55585E;
    --hema: #A9A3F0; --hema-hover: #BDB8F5; --hema-soft: #3E3D55; --on-hema: #1F1E2C;
    --ready: #6CC49A; --conditional: #E3B05C; --blocked: #F08A7E; --insufficient: #8FB0E3;
    --dot: #A3A8AF; --mean: #FFFFFF; --err-bg: #4A3232; --err-line: #6E4444; --ok-bg: #2F4539; --ok-line: #456B55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--hema); outline-offset: 2px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .app { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; }
  .rail { border-right: 1px solid var(--rule); background: var(--surface); padding: 22px 22px 40px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brandrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .wordmark { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .wordmark-sub { color: var(--slate); font-size: 13px; margin-top: 2px; }
  .ruo { display: inline-block; margin-top: 10px; font-size: 12px; color: var(--slate); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 7px; }
  .themebtn { border: 1px solid var(--rule); background: transparent; border-radius: 6px; padding: 3px 9px; font-size: 12px; color: var(--slate); cursor: pointer; white-space: nowrap; }
  .rail h3 { font-size: 13px; font-weight: 600; margin: 26px 0 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; padding: 6px 0; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--slate); }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.18); }
  label.f { display: block; font-size: 13px; color: var(--slate); margin: 12px 0 4px; }
  input.t { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--raised); }
  input.t:focus { border-color: var(--hema); outline: none; box-shadow: 0 0 0 3px var(--hema-soft); }
  input[type=file] { font-size: 13px; color: var(--slate); }
  .btn { border: 1px solid var(--rule); background: var(--raised); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-block; }
  a { color: var(--ink); text-underline-offset: 2px; }
  .btn, a.btn { color: var(--ink); }
  .btn:hover:not(:disabled) { border-color: var(--slate); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.primary { background: var(--hema); color: var(--on-hema); border-color: var(--hema); }
  .btn.primary:hover:not(:disabled) { background: var(--hema-hover); }
  .btn.block { width: 100%; margin-top: 12px; padding: 10px 14px; }
  .list { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; max-height: 230px; overflow-y: auto; }
  .row { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule-soft); background: var(--raised); padding: 8px 10px; cursor: pointer; font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row[aria-pressed="true"] { background: var(--hema-soft); color: var(--hema); font-weight: 600; }
  .row small { color: var(--faint); font-weight: 400; }
  .note { font-size: 13px; color: var(--slate); margin-top: 8px; }
  .err { margin-top: 12px; border: 1px solid var(--err-line); background: var(--err-bg); color: var(--blocked); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .ok { margin-top: 12px; border: 1px solid var(--ok-line); background: var(--ok-bg); color: var(--ready); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--slate); }
  pre.log { white-space: pre-wrap; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; background: var(--paper); padding: 8px; border-radius: 6px; max-height: 180px; overflow: auto; }
  .main { min-width: 0; padding: 26px 36px 80px; }
  .empty { max-width: 640px; margin: 12vh auto 0; }
  .empty h1 { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 10px; line-height: 1.2; }
  .empty ol { padding-left: 20px; color: var(--slate); }
  .empty li { margin: 6px 0; }
  .ledger { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 22px 26px 18px; }
  .ledger-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 20px; }
  .rel-name { font-size: 13px; color: var(--slate); }
  .rel-big { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .rel-right { text-align: right; }
  .verdict { text-align: center; }
  .verdict-word { font-size: 42px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .verdict-sub { font-size: 13px; color: var(--slate); margin-top: 6px; }
  .ribbon { margin-top: 18px; width: 100%; height: 56px; display: block; }
  .ribbon-anim { animation: draw 1.1s ease-out both; }
  @keyframes draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 13px; color: var(--slate); align-items: center; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .dotsw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .ringsw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1.5px dashed var(--slate); }
  .barsw { display: inline-block; width: 2px; height: 12px; margin-right: 6px; vertical-align: -2px; background: var(--mean); }
  .changes { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--rule); }
  .changes-head { font-size: 16px; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .chip { display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--rule); border-left-width: 4px; border-radius: 6px; padding: 8px 14px; background: var(--raised); font-size: 14px; }
  .chip-n { font-size: 22px; font-weight: 600; }
  .imap svg { width: 100%; height: auto; display: block; max-width: 1000px; margin: 8px auto 0; overflow: visible; }
  .imap .ttl { font-size: 12.5px; font-weight: 600; fill: var(--slate); }
  .imap .nt { font-size: 12px; font-family: "IBM Plex Mono", monospace; fill: var(--ink); }
  .imap .ns { font-size: 10.5px; fill: var(--slate); }
  .imap .clickable { cursor: pointer; }
  .imap .clickable:hover rect { filter: brightness(1.06); }
  .imap .flow { stroke-dasharray: 6 6; animation: imapflow 1.2s linear infinite; }
  @keyframes imapflow { to { stroke-dashoffset: -24; } }
  @media (prefers-reduced-motion: reduce) { .imap .flow { animation: none; } }
  .question { margin-top: 14px; font-size: 14px; color: var(--slate); max-width: 80ch; }
  .nav { position: sticky; top: 0; z-index: 5; background: var(--paper); display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 0; margin-top: 6px; border-bottom: 1px solid var(--rule); }
  .nav a { text-decoration: none; color: var(--slate); padding: 6px 12px; border-radius: 6px; font-size: 14px; }
  .nav a:hover { color: var(--ink); background: var(--surface); }
  section.s { padding-top: 34px; scroll-margin-top: 64px; }
  section.s > h2 { font-size: 20px; letter-spacing: -0.01em; margin: 0 0 4px; }
  .lede { color: var(--slate); margin: 0 0 16px; max-width: 80ch; font-size: 14px; }
  .steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); overflow: hidden; }
  .step { padding: 14px 16px; border-right: 1px solid var(--rule-soft); opacity: 0.25; transition: opacity 0.5s ease; }
  .step:last-child { border-right: 0; }
  .step.on { opacity: 1; }
  .step .n { font-size: 12px; color: var(--hema); font-weight: 600; }
  .step .t { font-size: 13px; color: var(--slate); margin-top: 2px; min-height: 38px; }
  .step .b { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
  .step .d { font-size: 12.5px; color: var(--slate); margin-top: 2px; }
  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; margin-top: 14px; }
  .panel h3 { font-size: 16px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
  .stat { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; background: var(--raised); transition: border-color 0.3s ease, box-shadow 0.3s ease; }
  .stat.on { border-color: var(--hema); box-shadow: 0 0 0 1px var(--hema); }
  .stat .l { font-size: 13px; color: var(--slate); }
  .stat .v { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-family: "IBM Plex Mono", monospace; margin-top: 2px; }
  .stat .d { font-size: 13px; color: var(--slate); }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 4px; margin-right: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 500; color: var(--slate); border-bottom: 1px solid var(--rule); padding: 6px 8px; position: sticky; top: 0; background: var(--surface); }
  td { border-bottom: 1px solid var(--rule-soft); padding: 6px 8px; vertical-align: top; }
  td.num { font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .changed { color: var(--conditional); }
  .restored { color: var(--ready); }
  .notrestored { color: var(--blocked); }
  .finding { background: var(--surface); border: 1px solid var(--rule); border-left-width: 4px; border-radius: 8px; margin-top: 10px; }
  .finding > button { width: 100%; text-align: left; border: 0; background: transparent; padding: 14px 16px; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
  .fid { font-weight: 600; font-family: "IBM Plex Mono", monospace; }
  .fsum { font-size: 15px; }
  .fmeta { font-size: 13px; color: var(--slate); margin-top: 4px; }
  .fbody { padding: 0 16px 14px 16px; }
  .chev { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .scroll { max-height: 300px; overflow: auto; border: 1px solid var(--rule-soft); border-radius: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 6px; }
  .tabset { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .tabset button { border: 0; border-right: 1px solid var(--rule); background: var(--raised); padding: 8px 14px; cursor: pointer; color: var(--slate); }
  .tabset button:last-child { border-right: 0; }
  .tabset button[aria-pressed="true"] { background: var(--hema-soft); color: var(--hema); font-weight: 600; }
  .story { font-size: 15px; min-height: 48px; margin: 8px 0 4px; max-width: 90ch; }
  .muted { color: var(--slate); font-size: 13px; }
  .footnote { border-top: 1px solid var(--rule); margin-top: 12px; padding-top: 10px; font-size: 13px; color: var(--slate); }
  ul.lim { margin: 6px 0 0; padding-left: 18px; } ul.lim li { margin: 4px 0; }
  .running { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--slate); }
  .bar { flex: 1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 35%; background: var(--hema); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { .ribbon-anim, .bar i { animation: none; } .step, .stat { transition: none; } }
  @media (max-width: 1100px) { .app { grid-template-columns: 1fr; } .rail { position: static; height: auto; } .steps { grid-template-columns: repeat(2, 1fr); } .two, .three { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  const { useState, useEffect, useRef, useMemo, useContext, createContext } = React;
  const html = htm.bind(React.createElement);

  const PALETTES = {
    light: { ink: "#1B2430", slate: "#5B6878", faint: "#8A95A3", rule: "#E3E8EE", track: "#D9DFE6", dot: "#8C97A6", mean: "#1B2430", hema: "#3F3A8C",
      kinds: { sample_swap: "#C8417A", duplicate: "#D9822B", membership_change: "#6D5BD0", missing_data: "#2F7EA8", label_conflict: "#2F7D5B", other: "#6B7280" },
      groups: ["#7F8FB3", "#C3A27F", "#8FB39B", "#B7A1C9", "#A3AAB3"], stages: ["#7F8FB3", "#C8417A", "#2F7D5B"] },
    dark: { ink: "#ECEDEE", slate: "#B0B5BC", faint: "#8C9198", rule: "#4A4D53", track: "#55585E", dot: "#A3A8AF", mean: "#FFFFFF", hema: "#A9A3F0",
      kinds: { sample_swap: "#F06FA0", duplicate: "#F2A65A", membership_change: "#B3A4F7", missing_data: "#6EC1E8", label_conflict: "#6CC49A", other: "#B0B5BC" },
      groups: ["#8E9CC0", "#CDAE8A", "#9CC2A8", "#C4AED6", "#AEB4BC"], stages: ["#8E9CC0", "#F06FA0", "#6CC49A"] },
  };
  const VERDICT = { light: { "Ready": "#2F7D5B", "Conditional": "#B7791F", "Blocked": "#B42318", "Insufficient Evidence": "#3F5E8C" },
                    dark: { "Ready": "#6CC49A", "Conditional": "#E3B05C", "Blocked": "#F08A7E", "Insufficient Evidence": "#8FB0E3" } };
  const SEV = { light: { high: "#B42318", medium: "#B7791F", low: "#3F5E8C", none: "#8A95A3" }, dark: { high: "#F08A7E", medium: "#E3B05C", low: "#8FB0E3", none: "#8C9198" } };
  const KIND_LABEL = { sample_swap: "profiles swapped", duplicate: "copied profile (new ID)", membership_change: "lost or renamed",
    missing_data: "values missing", label_conflict: "labels changed", other: "values changed" };

  const CHIP_LABEL = { sample_swap: "profiles swapped", duplicate: "copied profiles under new IDs", membership_change: "samples lost or renamed",
    missing_data: "samples with missing values", label_conflict: "samples with changed labels", other: "samples with changed values" };
  const Theme = createContext(null);
  const useT = () => useContext(Theme);
  const ok = (x) => x && !x.error;
  const short = (s) => (s || "").slice(5, 12);
  const klabel = (k) => KIND_LABEL[k] || k;
  const fmt = (v) => (v === null || v === undefined) ? "n/a" : (typeof v === "number" ? (Math.round(v * 1000) / 1000).toString() : String(v));
  const alpha = (hex, a) => { const n = parseInt(hex.slice(1), 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; };

  function baseLayout(T, extra) {
    return Object.assign({ paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
      font: { family: "IBM Plex Sans, sans-serif", color: T.ink, size: 12.5 }, margin: { l: 56, r: 16, t: 30, b: 48 },
      hoverlabel: { font: { family: "IBM Plex Mono, monospace", size: 12 } } }, extra || {});
  }
  const CFG = { responsive: true, displaylogo: false, modeBarButtonsToRemove: ["lasso2d", "select2d", "autoScale2d"] };

  async function api(path, opts) {
    const r = await fetch(path, opts);
    let body = null;
    try { body = await r.json(); } catch (e) { body = null; }
    if (!r.ok) {
      const d = body && body.detail;
      const msg = typeof d === "string" ? d : (body && body.log ? "The command failed. Open the log below." : "Request failed with status " + r.status + ".");
      const err = new Error(msg); err.log = body && body.log; throw err;
    }
    return body;
  }

  function Plot({ data, layout, height }) {
    const T = useT();
    const ref = useRef(null);
    useEffect(() => {
      const el = ref.current;
      Plotly.newPlot(el, data, baseLayout(T, Object.assign({ height: height || 420 }, layout || {})), CFG);
      return () => Plotly.purge(el);
    }, []);
    return html`<div ref=${ref} style=${{ width: "100%" }}></div>`;
  }

  // ---------- rail ----------
  function Rail(props) {
    const { releases, selected, setSelected, aPath, setAPath, onRun, running, elapsed, refresh, recent, loadRun, error, notice, setError, setNotice, theme, setTheme } = props;
    const T = useT();
    const [mode, setMode] = useState("envelope");
    const [num, setNum] = useState("");
    const [words, setWords] = useState("");
    const [upName, setUpName] = useState("");
    const [files, setFiles] = useState(null);
    const [busy, setBusy] = useState(false);

    async function openEnvelope(andRun) {
      setError(null); setNotice(null); setBusy(true);
      try {
        const r = await api("/api/unseal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ number: num, words: words }) });
        await refresh();
        if (r.release_id) { setSelected(r.release_id); setNotice("Envelope " + num.trim() + " opened."); if (andRun) onRun(r.release_id); }
        else setNotice("Envelope opened. Choose it under Saved.");
      } catch (e) { setError({ msg: e.message, log: e.log }); }
      setBusy(false);
    }
    async function saveUpload() {
      setError(null); setNotice(null); setBusy(true);
      try {
        const fd = new FormData();
        fd.append("name", upName.trim());
        Array.from(files || []).forEach(f => fd.append("files", f));
        const r = await api("/api/upload", { method: "POST", body: fd });
        await refresh(); setSelected(r.release_id);
        setNotice("Saved " + r.files.length + " files as " + upName.trim() + ".");
      } catch (e) { setError({ msg: e.message, log: e.log }); }
      setBusy(false);
    }
    const canEnvelope = num.trim() && words.trim().split(/\s+/).length === 4 && !busy && !running;
    const V = VERDICT[theme];
    return html`<aside className="rail">
      <div className="brandrow"><div><div className="wordmark">SNS Cohort Control Tower</div>
        <div className="wordmark-sub">Check a new data release before anyone uses it.</div></div>
        <button className="themebtn" onClick=${() => setTheme(theme === "dark" ? "light" : "dark")} aria-label="Switch color theme">${theme === "dark" ? "Light" : "Dark"}</button></div>
      <span className="ruo">Research use only</span>

      <h3>New release</h3>
      <div className="seg" role="group" aria-label="Release source">
        ${[["envelope", "Envelope"], ["saved", "Saved"], ["upload", "Upload"]].map(([k, l]) => html`<button key=${k} aria-pressed=${mode === k} onClick=${() => setMode(k)}>${l}</button>`)}
      </div>
      ${mode === "envelope" && html`<div>
        <label className="f" for="num">Envelope number</label>
        <input id="num" className="t mono" placeholder="07 or practice" value=${num} onInput=${e => setNum(e.target.value)} />
        <label className="f" for="words">Four words</label>
        <input id="words" className="t mono" placeholder="amber falcon river quartz" value=${words} onInput=${e => setWords(e.target.value)}
          onKeyDown=${e => { if (e.key === "Enter" && canEnvelope) openEnvelope(true); }} />
        <button className="btn primary block" disabled=${!canEnvelope} onClick=${() => openEnvelope(true)}>Open envelope and run check</button>
        <button className="btn block" disabled=${!canEnvelope} onClick=${() => openEnvelope(false)}>Open envelope only</button>
      </div>`}
      ${mode === "saved" && html`<div style=${{ marginTop: 12 }}>
        ${releases.length ? html`<div className="list">${releases.map(r => html`<button key=${r.id} className="row" aria-pressed=${selected === r.id} onClick=${() => setSelected(r.id)}>
            <span>${r.label}</span><small>${r.kind}</small></button>`)}</div>` : html`<div className="note">No releases yet. Open an envelope or upload files.</div>`}
      </div>`}
      ${mode === "upload" && html`<div>
        <label className="f" for="upn">Release name</label>
        <input id="upn" className="t mono" placeholder="my-release" value=${upName} onInput=${e => setUpName(e.target.value)} />
        <label className="f" for="upf">Files (.tsv, .tsv.gz, .csv)</label>
        <input id="upf" type="file" multiple onChange=${e => setFiles(e.target.files)} />
        <div className="note">Use the same file names as release A, for example clinical.tsv and protein_rppa.tsv.gz.</div>
        <button className="btn block" disabled=${!upName.trim() || !files || !files.length || busy} onClick=${saveUpload}>Save release</button>
      </div>`}

      <h3>Compare against</h3>
      <label className="f" for="apath">Trusted release A</label>
      <input id="apath" className="t mono" style=${{ fontSize: 12 }} value=${aPath} onInput=${e => setAPath(e.target.value)} />
      <button className="btn primary block" disabled=${!selected || running} onClick=${() => onRun(selected)}>${running ? "Checking" : "Run check"}</button>
      ${selected && !running && html`<div className="note">Selected: <span className="mono">${(releases.find(r => r.id === selected) || {}).label || selected}</span></div>`}
      ${running && html`<div className="running"><div className="bar"><i></i></div><span className="mono">${elapsed}s</span></div>`}
      ${notice && html`<div className="ok">${notice}</div>`}
      ${error && html`<div className="err">${error.msg}${error.log && html`<details><summary>Show log</summary><pre className="log">${error.log}</pre></details>`}</div>`}

      <h3>Recent checks</h3>
      ${recent.length ? html`<div className="list">${recent.map(r => html`<button key=${r.run_id} className="row" onClick=${() => loadRun(r.run_id)}>
          <span>${r.release_id ? r.release_id.split(":")[1] : r.run_id}</span><small style=${{ color: V[r.verdict] || T.faint }}>${r.verdict}</small></button>`)}</div>`
        : html`<div className="note">Checks you run appear here.</div>`}
    </aside>`;
  }

  // ---------- ledger ----------
  function Ledger({ doc, viz, meta, theme }) {
    const T = useT();
    const v = doc.verdict || "Unknown";
    const rb = viz.ribbon;
    const rels = (doc.data || {}).releases || [];
    const counts = {};
    if (ok(rb)) rb.marks.forEach(m => counts[m.kind] = (counts[m.kind] || 0) + 1);
    const n = ok(rb) ? rb.n : 0;
    return html`<div className="ledger">
      <div className="ledger-top">
        <div><div className="rel-name">Trusted release</div><div className="rel-big">${rels[0] ? rels[0].name : "A"}</div>
          ${ok(rb) && html`<div className="muted">${rb.n_a} samples in ${rb.file}</div>`}</div>
        <div className="verdict"><div className="verdict-word" style=${{ color: VERDICT[theme][v] || T.ink }}>${v}</div>
          <div className="verdict-sub">${(doc.findings || []).length} findings, checked in ${meta.seconds}s</div></div>
        <div className="rel-right"><div className="rel-name">New release</div><div className="rel-big">${rels[1] ? rels[1].name : "B"}</div>
          ${ok(rb) && html`<div className="muted">${rb.n_b} samples in ${rb.file}</div>`}</div>
      </div>
      ${ok(rb) ? html`<div className="changes">
          <div className="changes-head">${rb.n_a === rb.n_b ? "Same sample count (" + rb.n_a + " in both releases), but " : rb.n_a + " samples before, " + rb.n_b + " after. "}${rb.marks.length} sample${rb.marks.length === 1 ? "" : "s"} changed in <span className="mono">${rb.file}</span>${rb.marks.length ? ":" : "."}</div>
          ${rb.marks.length > 0 && html`<div className="chips">${Object.keys(counts).map(k => html`<div key=${k} className="chip" style=${{ borderLeftColor: T.kinds[k] || T.slate }}>
            <span className="chip-n mono">${counts[k]}</span><span>${CHIP_LABEL[k] || klabel(k)}</span></div>`)}</div>`}
        </div>` : html`<div className="changes"><div className="changes-head">No sample changed in any file.</div></div>`}
      <div className="question">${doc.question}</div>
    </div>`;
  }

  // ---------- summary ----------
  function Steps({ p }) {
    const steps = [
      ["Files fingerprinted", String(p.files_total), p.files_changed.length + " changed" + (p.files_changed.length ? ": " + p.files_changed.join(", ") : "")],
      ["Rows fingerprinted", String(p.rows_checked), p.samples_changed + " samples changed"],
      ["Changes named", String(p.n_findings), p.kinds.join(", ") || "none"],
      ["Group check", p.group ? p.group.value : "none", p.group ? p.group.a + " to " + p.group.b + " samples with data" : "no single group lost"],
      ["Analyses affected", p.affected.join(", ") || "none", "safe: " + (p.safe.join(", ") || "none")],
      ["Repair proof", p.proof, p.restored.length ? "restored: " + p.restored.join(", ") : "nothing to restore"],
    ];
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const [shown, setShown] = useState(reduce ? steps.length : 0);
    useEffect(() => { if (shown >= steps.length) return; const id = setTimeout(() => setShown(shown + 1), 420); return () => clearTimeout(id); }, [shown]);
    return html`<div className="steps">${steps.map((s, i) => html`<div key=${i} className=${"step" + (i < shown ? " on" : "")}>
      <div className="n">Step ${i + 1}</div><div className="t">${s[0]}</div><div className="b">${s[1]}</div><div className="d">${s[2]}</div></div>`)}</div>`;
  }

  // ---------- what changed ----------
  function Swap({ s }) {
    const T = useT();
    const lo = Math.min(...s.new_s1, ...s.old_s2, ...s.old_s1), hi = Math.max(...s.new_s1, ...s.old_s2, ...s.old_s1);
    const mk = (x, c) => [{ type: "scatter", mode: "lines", x: [lo, hi], y: [lo, hi], line: { color: T.track, width: 1.5 }, hoverinfo: "skip", showlegend: false },
      { type: "scatter", mode: "markers", x: x, y: s.new_s1, text: s.features, hovertemplate: "%{text}<br>old %{x}<br>new %{y}<extra></extra>", showlegend: false, marker: { size: 7, color: c, opacity: 0.85 } }];
    const lay = (t) => ({ title: { text: t, font: { size: 13 } }, xaxis: { title: "old release value", gridcolor: T.rule, zeroline: false }, yaxis: { title: "new value of " + short(s.s1), gridcolor: T.rule, zeroline: false } });
    return html`<div className="panel"><h3>Proof of the swap</h3>
      <div className="muted">All ${s.n} values of <span className="mono">${s.s1}</span> in the new release, compared with two candidates from the old release.</div>
      <div className="two" style=${{ marginTop: 8 }}>
        <div><${Plot} data=${mk(s.old_s2, T.kinds.sample_swap)} height=${370} layout=${lay("against " + s.s2 + " in the old release")} />
          <div className="muted">Largest difference <span className="mono restored">${s.maxdiff_match}</span>. Every point sits on the line: identical values.</div></div>
        <div><${Plot} data=${mk(s.old_s1, T.dot)} height=${370} layout=${lay("against its own old values")} />
          <div className="muted">Largest difference <span className="mono notrestored">${s.maxdiff_own.toFixed(3)}</span>. A different profile.</div></div>
      </div>
      <div className="footnote">Two lab measurements never match to every decimal, so these values were moved between IDs, not measured again.</div></div>`;
  }

  // ---------- impact ----------
  function flatten(d, p, o) { Object.keys(d || {}).forEach(k => { const v = d[k]; if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, p + k + ".", o); else if (!Array.isArray(v)) o[p + k] = v; }); return o; }
  function headline(d) {
    if (!d) return null;
    if (typeof d.difference === "number") return ["difference", d.difference];
    const k = Object.keys(d).find(k => typeof d[k] === "number" && !k.startsWith("n_"));
    return k ? [k, d[k]] : null;
  }
  function counts(d) { return Object.keys(d || {}).filter(k => k.startsWith("n_") && k !== "n_samples" && typeof d[k] === "number").map(k => d[k] + " " + k.slice(2)).join(", "); }

  function AnalysisCard({ a, theme }) {
    const b = flatten(a.before, "", {}), n = flatten(a.after, "", {}), r = flatten(a.after_repair, "", {});
    const keys = Array.from(new Set(Object.keys(b).concat(Object.keys(n), Object.keys(r)))).sort();
    const c = VERDICT[theme][a.verdict] || "#8A95A3";
    return html`<div className="panel">
      <div><span className="pill" style=${{ background: alpha(c, 0.15), color: c }}>${a.verdict}</span><b>${a.id}</b> <span className="muted">${a.description}</span></div>
      <div style=${{ marginTop: 6, fontSize: 14 }}>${a.reason}</div>
      <div className="muted" style=${{ marginTop: 2 }}>Reads ${(a.inputs || []).join(", ")}. Repair restores the original result: <b className=${a.repair_restores_before ? "restored" : "notrestored"}>${a.repair_restores_before ? "yes" : "no"}</b>.</div>
      ${keys.length > 0 && html`<div className="scroll" style=${{ marginTop: 10 }}><table>
        <thead><tr><th>Value</th><th>Old release</th><th>New release</th><th>After repair</th></tr></thead>
        <tbody>${keys.map(k => html`<tr key=${k}><td>${k}</td><td className="num">${fmt(b[k])}</td>
          <td className=${"num" + (b[k] !== n[k] ? " changed" : "")}>${fmt(n[k])}</td>
          <td className=${"num " + (r[k] === b[k] ? "restored" : "notrestored")}>${fmt(r[k])}</td></tr>`)}</tbody></table></div>`}
    </div>`;
  }

  function ImpactMap({ doc, theme }) {
    const T = useT();
    const N = doc.findings || [], A = doc.analyses || [];
    const F = [];
    const add = (f) => { if (f && !F.includes(f)) F.push(f); };
    N.forEach(f => (f.evidence || []).forEach(e => add(e.file)));
    A.forEach(a => (a.inputs || []).forEach(add));
    if (!F.length || !A.length) return null;
    const W = 760, rowH = 46, top = 34;
    const H = top + Math.max(F.length, N.length, A.length, 1) * rowH + 10;
    const X = [10, 290, 560], WD = [200, 190, 190];
    const yy = (i, n) => top + (H - top - 10 - n * rowH) / 2 + i * rowH;
    const pos = {};
    F.forEach((f, i) => pos["f:" + f] = { x: X[0], y: yy(i, F.length) });
    N.forEach((f, i) => pos["n:" + f.id] = { x: X[1], y: yy(i, N.length) });
    A.forEach((a, i) => pos["a:" + a.id] = { x: X[2], y: yy(i, A.length) });
    const curve = (p, q, wp) => { const x1 = p.x + wp, y1 = p.y + 17, x2 = q.x, y2 = q.y + 17, m = (x1 + x2) / 2; return "M" + x1 + "," + y1 + " C" + m + "," + y1 + " " + m + "," + y2 + " " + x2 + "," + y2; };
    const sev = SEV[theme], ver = VERDICT[theme];
    const changed = new Set(N.flatMap(f => (f.evidence || []).map(e => e.file)).filter(Boolean));
    const clip = (t, n) => t.length > n ? t.slice(0, n - 1) + "\u2026" : t;
    const paths = [];
    A.forEach(a => (a.inputs || []).forEach(f => {
      const p = pos["f:" + f], q = pos["a:" + a.id];
      if (p && q) paths.push(html`<path key=${"r" + a.id + f} d=${curve(p, q, WD[0])} fill="none" stroke=${T.faint} strokeOpacity="0.45" strokeWidth="1" strokeDasharray="2 4" />`);
    }));
    N.forEach(f => {
      const q = pos["n:" + f.id], col = sev[f.severity] || T.hema;
      Array.from(new Set((f.evidence || []).map(e => e.file).filter(Boolean))).forEach(file => {
        const p = pos["f:" + file];
        if (p) paths.push(html`<path key=${"fn" + f.id + file} className="flow" d=${curve(p, q, WD[0])} fill="none" stroke=${col} strokeOpacity="0.7" strokeWidth="2" />`);
      });
      (f.affects_analyses || []).forEach(aid => {
        const p2 = pos["a:" + aid];
        if (p2) paths.push(html`<path key=${"na" + f.id + aid} className="flow" d=${curve(q, p2, WD[1])} fill="none" stroke=${col} strokeOpacity="0.9" strokeWidth="2.4" />`);
      });
    });
    const node = (key, p, wd, title, sub, stroke, fill, onClick) => html`<g key=${key} transform=${"translate(" + p.x + "," + p.y + ")"}
        className=${onClick ? "clickable" : ""} onClick=${onClick} role=${onClick ? "button" : null} tabIndex=${onClick ? 0 : null}
        onKeyDown=${onClick ? (e => { if (e.key === "Enter") onClick(); }) : null}>
        <title>${title + ", " + sub}</title>
        <rect width=${wd} height="34" rx="8" fill=${fill || "var(--raised)"} stroke=${stroke || "var(--rule)"} strokeWidth=${stroke ? 1.6 : 1} />
        <text className="nt" x="10" y="15">${clip(title, Math.floor(wd / 7.4))}</text>
        <text className="ns" x="10" y="28">${clip(sub, Math.floor(wd / 6.2))}</text></g>`;
    const jump = (id) => () => { const el = document.getElementById("finding-" + id); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); };
    const nodes = [];
    F.forEach(f => nodes.push(node("f" + f, pos["f:" + f], WD[0], f, changed.has(f) ? "changed in the new release" : "no finding", changed.has(f) ? ver["Conditional"] : null, null, null)));
    N.forEach(f => nodes.push(node("n" + f.id, pos["n:" + f.id], WD[1], f.id + ", " + klabel(f.kind), f.severity + " severity", sev[f.severity], null, jump(f.id))));
    A.forEach(a => {
      const safe = !(a.affected_by || a.affects || []).length && a.status !== "changed";
      const cols = Object.values(a.uses_columns || {}).flat().slice(0, 2).join(", ");
      const c = safe ? ver["Ready"] : ver["Blocked"];
      nodes.push(node("a" + a.id, pos["a:" + a.id], WD[2], a.id + ", " + (safe ? "left alone" : "affected"), cols || a.verdict || "", c, alpha(c, 0.12), null));
    });
    return html`<div className="panel imap"><h3>Impact map</h3>
      <div className="muted">Which file each finding comes from, and which analysis it reaches. Dotted lines show the files each analysis reads. Click a finding to see its evidence.</div>
      <svg viewBox=${"0 0 " + W + " " + H} role="img" aria-label="Impact map from files to findings to analyses">
        <text className="ttl" x=${X[0]} y="16">Files</text><text className="ttl" x=${X[1]} y="16">Findings</text><text className="ttl" x=${X[2]} y="16">Analyses</text>
        ${paths}${nodes}
      </svg></div>`;
  }

  function Replay({ rp }) {
    const T = useT();
    const ref = useRef(null);
    const timers = useRef([]);
    const [stage, setStage] = useState("a");
    const G = rp.groups.length;
    const frames = useMemo(() => {
      const build = (key) => {
        const x = [], y = [], op = [], text = [];
        rp.samples.forEach(s => {
          const p = s[key] || s.a || s.b || s.r;
          x.push(p[1]); y.push(p[0] + s.j); op.push(s[key] ? (s.kind ? 1 : 0.7) : 0);
          text.push(s[key] && s.kind ? short(s.id) : "");
        });
        const gx = [], gy = [], gop = [];
        rp.samples.forEach(s => {
          const lost = s.a && !s[key] && key !== "a";
          const p = s.a || s.b;
          gx.push(p[1]); gy.push(p[0] + s.j); gop.push(lost ? 1 : 0);
        });
        const m = rp.stats[key].means, mx = [], my = [], lx = [], ly = [], lt = [];
        m.forEach((v, gi) => { if (v !== null) { mx.push(v, v, null); my.push(gi - 0.42, gi + 0.42, null); lx.push(v); ly.push(gi + 0.55); lt.push("mean " + v); } });
        return { x, y, op, text, gx, gy, gop, mx, my, lx, ly, lt };
      };
      return { a: build("a"), b: build("b"), r: build("r") };
    }, [rp]);
    const head = { a: headline(rp.before), b: headline(rp.after), r: headline(rp.after_repair) };
    useEffect(() => {
      const el = ref.current, f = frames.a;
      const color = rp.samples.map(s => s.kind ? (T.kinds[s.kind] || T.slate) : T.dot);
      const size = rp.samples.map(s => s.kind ? 11 : 6.5);
      const lostColor = T.kinds.membership_change;
      Plotly.newPlot(el, [
        { type: "scatter", mode: "markers+text", ids: rp.samples.map(s => s.id), x: f.x, y: f.y, text: f.text, textposition: "bottom center", cliponaxis: false,
          textfont: { family: "IBM Plex Mono", size: 11, color: T.ink }, hovertext: rp.samples.map(s => s.id + (s.kind ? ", " + klabel(s.kind) : "")), hoverinfo: "text+x",
          marker: { color: color, size: size, opacity: f.op, line: { width: 0 } } },
        { type: "scatter", mode: "markers", x: f.gx, y: f.gy, hoverinfo: "skip", marker: { size: 11, color: "rgba(0,0,0,0)", opacity: f.gop, line: { color: lostColor, width: 1.6 } } },
        { type: "scatter", mode: "lines", x: f.mx, y: f.my, line: { color: T.mean, width: 2.5 }, hoverinfo: "skip" },
        { type: "scatter", mode: "text", x: f.lx, y: f.ly, text: f.lt, textposition: "bottom center", cliponaxis: false, textfont: { color: T.ink, size: 12, family: "IBM Plex Sans" }, hoverinfo: "skip" },
      ], baseLayout(T, { height: 150 + 150 * G, showlegend: false, margin: { l: 110, r: 24, t: 10, b: 52 },
        xaxis: { title: rp.feature, gridcolor: T.rule, zeroline: false },
        yaxis: { tickvals: rp.groups.map((_, i) => i), ticktext: rp.groups, range: [G - 0.3, -0.7], gridcolor: "rgba(0,0,0,0)", tickfont: { size: 13, color: T.ink } } }), CFG);
      return () => { timers.current.forEach(clearTimeout); Plotly.purge(el); };
    }, [rp]);
    function go(key) {
      const f = frames[key];
      setStage(key);
      Plotly.restyle(ref.current, { text: [f.text] }, [0]);
      Plotly.restyle(ref.current, { text: [f.lt] }, [3]);
      Plotly.animate(ref.current, { data: [
        { x: f.x, y: f.y, "marker.opacity": f.op }, { x: f.gx, y: f.gy, "marker.opacity": f.gop }, { x: f.mx, y: f.my }, { x: f.lx, y: f.ly } ], traces: [0, 1, 2, 3] },
        { transition: { duration: 1300, easing: "cubic-in-out" }, frame: { duration: 1300, redraw: false } });
    }
    function play() {
      timers.current.forEach(clearTimeout);
      go("a");
      timers.current = [setTimeout(() => go("b"), 2600), setTimeout(() => go("r"), 6200)];
    }

    const swapped = rp.samples.filter(s => s.kind === "sample_swap" && s.a && s.b);
    const copies = rp.samples.filter(s => s.kind === "duplicate" && !s.a && s.b);
    const lost = rp.samples.filter(s => s.a && !s.b);
    const other = rp.samples.filter(s => s.kind && s.kind !== "sample_swap" && s.kind !== "duplicate" && s.a && s.b);
    const ntot = (k) => rp.stats[k].n.reduce((x, y) => x + y, 0);
    const meanText = (k) => rp.groups.map((g, i) => g + " " + fmt(rp.stats[k].means[i])).join(", ");
    const story = {
      a: html`<b>Release A.</b> ${ntot("a")} tumors. Group means: ${meanText("a")}.${head.a ? html` The ${head.a[0]} is <b className="mono">${fmt(head.a[1])}</b>.` : ""}`,
      b: html`<b>Release B as delivered.</b> ${[
          swapped.length ? swapped.map(s => short(s.id) + " moves from " + fmt(s.a[1]) + " to " + fmt(s.b[1])).join("; ") + "." : "",
          copies.length ? copies.length + " copied profile" + (copies.length > 1 ? "s appear" : " appears") + " under new IDs." : "",
          lost.length ? lost.length + " sample" + (lost.length > 1 ? "s are" : " is") + " missing (rings)." : "",
          other.length ? other.length + " sample" + (other.length > 1 ? "s" : "") + " changed value." : "",
        ].filter(Boolean).join(" ")} ${head.b ? html`The ${head.b[0]} becomes <b className="mono changed">${fmt(head.b[1])}</b>.` : ""}`,
      r: html`<b>Release B after the proposed repairs.</b> Swaps restored, copies excluded, missing samples restored. ${head.r ? html`The ${head.r[0]} is <b className="mono restored">${fmt(head.r[1])}</b>${rp.repair_restores_before ? ", exactly as in release A." : "."}` : ""}`,
    };
    const card = (k, label) => html`<div className=${"stat" + (stage === k ? " on" : "")}><div className="l">${label}</div>
      <div className=${"v " + (k === "b" && head.a && head.b && head.a[1] !== head.b[1] ? "changed" : k === "r" && rp.repair_restores_before ? "restored" : "")}>${head[k] ? fmt(head[k][1]) : "n/a"}</div>
      <div className="d">${k === "r" ? (rp.repair_restores_before ? "matches release A exactly" : "does not match release A") : counts(k === "a" ? rp.before : rp.after)}${k === "b" && head.a && head.b ? ", " + (head.b[1] - head.a[1] >= 0 ? "+" : "") + fmt(head.b[1] - head.a[1]) : ""}</div></div>`;

    return html`<div className="panel"><h3>${rp.id}, replayed across releases</h3>
      <div className="muted">Each dot is one primary tumor: its ${rp.feature} value and its ${rp.group_col} label. ${rp.description}</div>
      <div className="three">${card("a", "Release A, " + (head.a ? head.a[0] : "result"))}${card("b", "Release B, as delivered")}${card("r", "Release B, after proposed repairs")}</div>
      <div className="controls">
        <button className="btn primary" onClick=${play}>Play the story</button>
        <div className="tabset" role="group" aria-label="Release stage">
          ${[["a", "Release A"], ["b", "Release B"], ["r", "B repaired"]].map(([k, l]) => html`<button key=${k} aria-pressed=${stage === k} onClick=${() => { timers.current.forEach(clearTimeout); go(k); }}>${l}</button>`)}
        </div>
      </div>
      <div className="story" aria-live="polite">${story[stage]}</div>
      <div className="legend">
        <span><i className="dotsw" style=${{ background: T.dot }}></i>unchanged</span>
        ${Array.from(new Set(rp.samples.filter(s => s.kind).map(s => s.kind))).map(k => html`<span key=${k}><i className="dotsw" style=${{ background: T.kinds[k] }}></i>${klabel(k)}</span>`)}
        ${lost.length > 0 && html`<span><i className="ringsw" style=${{ borderColor: T.kinds.membership_change }}></i>missing from release B</span>`}
        <span><i className="barsw"></i>group mean</span>
      </div>
      <div ref=${ref}></div>
      <div className="footnote">Research data checking only, not a clinical result. Detection uses exact profile matches; a copy with a few values altered is reported as an edit or a near copy. Every finding needs human review.</div>
    </div>`;
  }

  function ShareReplay({ a }) {
    const T = useT();
    const key = ["percent", "counts"].find(k => a.before && typeof a.before[k] === "object" && a.before[k] !== null);
    if (!key) return null;
    const cats = Array.from(new Set(Object.keys(a.before[key]).concat(Object.keys((a.after || {})[key] || {}))));
    const series = [["Release A", a.before], ["Release B", a.after], ["After repair", a.after_repair]];
    const data = series.map(([name, d], i) => ({ type: "bar", name: name, x: cats, y: cats.map(c => ((d || {})[key] || {})[c]), marker: { color: T.stages[i] },
      text: cats.map(c => fmt(((d || {})[key] || {})[c])), textposition: "outside", textfont: { family: "IBM Plex Mono", size: 11 } }));
    const same = cats.every(c => (a.before[key] || {})[c] === ((a.after || {})[key] || {})[c]);
    return html`<div className="panel"><h3>${a.id}, ${key} by group across releases</h3>
      <div className="muted">${a.description} ${same ? "Every bar is identical in all three releases, so this result is safe to use." : "Bars that differ between releases show where the change lands."}</div>
      <${Plot} data=${data} height=${360} layout=${{ barmode: "group", bargap: 0.25, legend: { orientation: "h", y: 1.12 }, yaxis: { title: key, gridcolor: T.rule }, margin: { l: 56, r: 16, t: 40, b: 40 } }} />
    </div>`;
  }

  // ---------- evidence ----------
  function Finding({ f, open: open0, theme }) {
    const T = useT();
    const [open, setOpen] = useState(open0);
    const sc = SEV[theme][f.severity] || T.faint;
    return html`<div className="finding" id=${"finding-" + f.id} style=${{ borderLeftColor: T.kinds[f.kind] || T.slate, scrollMarginTop: "80px" }}>
      <button aria-expanded=${open} onClick=${() => setOpen(!open)}>
        <span className="fid">${f.id}</span>
        <span><div className="fsum">${f.summary}</div>
          <div className="fmeta"><span className="pill" style=${{ background: alpha(sc, 0.15), color: sc }}>${f.severity}</span>
            ${klabel(f.kind)}. Affects ${(f.affects_analyses || []).join(", ") || "no analysis"}.${f.needs_human_review ? " Needs human review." : ""}</div></span>
        <span className="chev">${open ? "Hide" : "Show"} ${(f.evidence || []).length} records</span>
      </button>
      ${open && html`<div className="fbody">
        ${f.limitation && html`<div className="muted">Limitation: ${f.limitation}</div>`}
        ${f.detected_by && html`<div className="muted">Detected by: ${f.detected_by}. Confidence: ${f.confidence}.</div>`}
        <div className="scroll" style=${{ marginTop: 8 }}><table>
          <thead><tr><th>Record</th><th>ID</th><th>Release</th><th>File</th><th>Note</th></tr></thead>
          <tbody>${(f.evidence || []).map((e, i) => html`<tr key=${i}><td>${e.kind}</td><td className="num">${e.id}</td><td>${e.release || ""}</td><td>${e.file || ""}</td><td>${e.note || ""}</td></tr>`)}</tbody>
        </table></div></div>`}
    </div>`;
  }

  // ---------- export ----------
  function Export({ meta, doc }) {
    const [res, setRes] = useState({});
    const [busy, setBusy] = useState(null);
    async function build(id) {
      setBusy(id);
      try { const r = await api("/api/runs/" + meta.run_id + "/cohort", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ analysis: id }) });
        setRes(x => Object.assign({}, x, { [id]: r })); }
      catch (e) { setRes(x => Object.assign({}, x, { [id]: { error: e.message } })); }
      setBusy(null);
    }
    return html`<div>
      <div className="panel"><h3>Findings file</h3>
        <div className="muted">The shared format v0.2 file read by the organizers' checker and the Repair Review Desk.</div>
        <div className="controls"><a className="btn" href=${"/api/runs/" + meta.run_id + "/findings.json"}>Download findings.json</a></div></div>
      <div className="panel"><h3>Clean cohort</h3>
        <div className="muted">Applies the proposed repairs and returns one row per sample for the chosen analysis.</div>
        ${(doc.analyses || []).map(a => html`<div key=${a.id} className="controls">
          <button className="btn" disabled=${busy === a.id} onClick=${() => build(a.id)}>${busy === a.id ? "Building" : "Build cohort for " + a.id}</button>
          ${res[a.id] && !res[a.id].error && html`<span className="muted"><span className="mono">${res[a.id].n_samples}</span> samples, <span className="mono">${res[a.id].n_duplicates}</span> duplicates,
            <span className="mono">${res[a.id].n_flagged}</span> flagged for review. <a href=${res[a.id].download}>Download CSV</a></span>`}
          ${res[a.id] && res[a.id].error && html`<span className="notrestored muted">${res[a.id].error}</span>`}
        </div>`)}</div>
    </div>`;
  }

  // ---------- results ----------
  function Results({ payload, theme }) {
    const { doc, viz, meta } = payload;
    const missing = (doc.sns_run || {}).files_not_in_release || [];
    const findings = doc.findings || [];
    const replayIds = Array.isArray(viz.replays) ? viz.replays.map(r => r.id) : [];
    return html`<div>
      <${Ledger} doc=${doc} viz=${viz} meta=${meta} theme=${theme} />
      <nav className="nav" aria-label="Sections">
        ${[["impact", "Impact"], ...(ok(viz.swap) ? [["changes", "Proof"]] : []), ["summary", "How it was checked"], ["evidence", "Evidence"], ["repairs", "Repairs and limits"], ["export", "Export"]]
          .map(([id, l]) => html`<a key=${id} href=${"#" + id}>${l}</a>`)}
      </nav>

      <section className="s" id="impact"><h2>Impact on the analyses</h2>
        <p className="lede">Each analysis is rerun on the old release, the new release, and the new release after the proposed repairs.</p>
        <${ImpactMap} doc=${doc} theme=${theme} />
        ${Array.isArray(viz.replays) && viz.replays.map(rp => html`<${Replay} key=${rp.id} rp=${rp} />`)}
        ${(doc.analyses || []).filter(a => !replayIds.includes(a.id)).map(a => html`<${ShareReplay} key=${"sh" + a.id} a=${a} />`)}
        ${(doc.analyses || []).map(a => html`<${AnalysisCard} key=${a.id} a=${a} theme=${theme} />`)}
      </section>

      ${ok(viz.swap) && html`<section className="s" id="changes"><h2>Proof</h2>
        <p className="lede">The raw values behind the swap, so the finding can be checked by eye.</p>
        <${Swap} s=${viz.swap} />
      </section>`}

      <section className="s" id="summary"><h2>How it was checked</h2>
        <p className="lede">Six steps, from file fingerprints to a tested repair.</p>
        ${ok(viz.pipeline) && html`<${Steps} p=${viz.pipeline} />`}
      </section>

      <section className="s" id="evidence"><h2>Evidence</h2>
        <p className="lede">${findings.length ? "Every finding lists the exact records behind it, so any line can be checked in the files." : "No changes were found that need review."}</p>
        ${findings.map((f, i) => html`<${Finding} key=${f.id} f=${f} open=${i === 0} theme=${theme} />`)}
      </section>

      <section className="s" id="repairs"><h2>Repairs and limits</h2>
        <div className="panel"><h3>Proposed repairs</h3>
          <div className="muted">Proposals only. A person approves or rejects each one.</div>
          ${(doc.repairs || []).length ? html`<div className="scroll" style=${{ marginTop: 10 }}><table>
            <thead><tr><th>Repair</th><th>Action</th><th>Fixes</th><th>Records</th><th>Why</th></tr></thead>
            <tbody>${doc.repairs.map(r => html`<tr key=${r.id}><td className="num">${r.id}</td><td>${r.action.split("_").join(" ")}</td><td className="num">${(r.addresses || []).join(", ")}</td><td className="num">${(r.targets || []).length}</td><td>${r.justification}</td></tr>`)}</tbody></table></div>`
            : html`<div className="muted" style=${{ marginTop: 8 }}>Nothing to repair.</div>`}</div>
        ${missing.length > 0 && html`<div className="panel"><h3>Files not in this release</h3>
          <div className="muted"><span className="mono">${missing.join(", ")}</span>. No analysis reads them, so they were not compared.</div></div>`}
        <div className="panel"><h3>What this check cannot tell you</h3><ul className="lim">
          <li>It sees what changed between two releases, not why it changed.</li>
          <li>It treats release A as the trusted version, so every finding needs human review.</li>
          <li>It checks tables only. Slide images are not checked.</li>
          <li>Sample IDs must start with TCGA-.</li>
          <li>In sparse files such as mutation calls, a near copy of a sample with very few non-zero values cannot be told apart from a real sample.</li>
          <li>The 10% line between Conditional and Blocked is our own review rule.</li>
          <li>Research use only. No diagnosis, treatment advice or clinical claims.</li></ul></div>
      </section>

      <section className="s" id="export"><h2>Export</h2><${Export} meta=${meta} doc=${doc} /></section>
    </div>`;
  }

  function App() {
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    const [theme, setTheme] = useState(() => { try { return localStorage.getItem("sns-theme") || (prefersDark ? "dark" : "light"); } catch (e) { return prefersDark ? "dark" : "light"; } });
    const [releases, setReleases] = useState([]);
    const [selected, setSelected] = useState(null);
    const [aPath, setAPath] = useState("");
    const [payload, setPayload] = useState(null);
    const [running, setRunning] = useState(false);
    const [elapsed, setElapsed] = useState("0.0");
    const [recent, setRecent] = useState([]);
    const [error, setError] = useState(null);
    const [notice, setNotice] = useState(null);

    useEffect(() => { document.documentElement.setAttribute("data-theme", theme); try { localStorage.setItem("sns-theme", theme); } catch (e) {} }, [theme]);
    async function refresh() { const r = await api("/api/releases"); setReleases(r.releases); setAPath(p => p || r.default_a); return r.releases; }
    async function refreshRuns() { const r = await api("/api/runs"); setRecent(r.runs); }
    useEffect(() => {
      refresh().catch(() => setError({ msg: "The server is not reachable. Start it with: python sns/server.py" }));
      refreshRuns().catch(() => {});
    }, []);
    useEffect(() => {
      if (!running) return;
      const t0 = Date.now();
      const id = setInterval(() => setElapsed(((Date.now() - t0) / 1000).toFixed(1)), 100);
      return () => clearInterval(id);
    }, [running]);

    async function onRun(rid) {
      setError(null); setRunning(true); setElapsed("0.0");
      try {
        const r = await api("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ release_id: rid, a_path: aPath || null }) });
        setPayload(r); setNotice(null); refreshRuns(); window.scrollTo({ top: 0 });
      } catch (e) { setError({ msg: e.message, log: e.log }); }
      setRunning(false);
    }
    async function loadRun(id) {
      setError(null);
      try { const r = await api("/api/runs/" + id); setPayload(r); window.scrollTo({ top: 0 }); } catch (e) { setError({ msg: e.message }); }
    }
    const T = PALETTES[theme];
    return html`<${Theme.Provider} value=${T}><div className="app">
      <${Rail} releases=${releases} selected=${selected} setSelected=${setSelected} aPath=${aPath} setAPath=${setAPath}
        onRun=${onRun} running=${running} elapsed=${elapsed} refresh=${refresh} recent=${recent} loadRun=${loadRun}
        error=${error} notice=${notice} setError=${setError} setNotice=${setNotice} theme=${theme} setTheme=${setTheme} />
      <main className="main">
        ${payload ? html`<${Results} key=${payload.meta.run_id + theme} payload=${payload} theme=${theme} />` : html`<div className="empty">
          <h1>Check a new release before anyone uses it</h1>
          <p className="lede">The check compares the new release with the trusted release sample by sample, then reruns every analysis that depends on what changed.</p>
          <ol><li>Open the judge's envelope with its number and four words, or choose a saved release.</li>
            <li>Run the check. It takes a few seconds.</li>
            <li>Read the verdict, play the replay, then check the evidence behind each finding.</li></ol></div>`}
      </main>
    </div></${Theme.Provider}>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
